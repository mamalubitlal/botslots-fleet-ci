name: moltbook-loop
on:
  schedule:
    - cron: '7 1,9,17 * * *'
  workflow_dispatch:
concurrency:
  group: moltbook
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_PW: ${{ secrets.BUNDLE_PW }}
      WORKFLOW_NAME: moltbook
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt bundle
        run: bash runner/decrypt.sh
      - name: Setup deps
        run: |
          pip install -q paramiko requests
          npm config set allow-scripts=opencode-ai --location=user
          npm install -g opencode-ai @lucid-agents/taskmarket@1.44.0
          mkdir -p ~/.config/opencode ~/.taskmarket
          cp fleet/creds/opencode_zen_api_key.txt key.txt
          KEY=$(cat key.txt); rm key.txt
          printf '{\n  "opencode": {\n    "type": "api",\n    "key": "%s"\n  }\n}\n' "$KEY" > ~/.config/opencode/auth.json
          chmod 600 ~/.config/opencode/auth.json
          cp fleet/creds/taskmarket_keystore_backup.json ~/.taskmarket/keystore.json
          chmod 600 ~/.taskmarket/keystore.json
      - name: Run moltbook loop
        run: python3 runner/moltbook_driver.py
      - name: Recommit state
        run: bash runner/recommit.sh
      - name: Wipe plaintext
        if: always()
        run: bash runner/wipe.sh
